# =====================================================
# APLICACION
# =====================================================
spring.application.name=backend


# =====================================================
# POSTGRESQL - PRODUCCION
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ferreteria

spring.datasource.username=${DB_USERNAME:postgres}

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# =====================================================
# JPA / HIBERNATE
# =====================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=false

spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City


# =====================================================
# SERVER
# =====================================================
server.address=0.0.0.0

server.port=${SERVER_PORT:8081}


# =====================================================
# LOGGING
# =====================================================
logging.level.root=INFO

logging.level.org.hibernate.SQL=INFO


# =====================================================
# FRONTEND
# =====================================================
frontend.origin=${FRONTEND_ORIGIN}

# ==========================================
# ALMACENAMIENTO DE PLANTILLAS
# ==========================================

app.uploads.plantillas=uploads/plantillas

# Tamaño máximo permitido por archivo
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

